# NVIDIA GPU for Ollama (Linux, or Windows with WSL2).
# Needs the NVIDIA driver plus the NVIDIA Container Toolkit on the host.
# Turned on by ./lab.sh setup when it finds nvidia-smi.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
